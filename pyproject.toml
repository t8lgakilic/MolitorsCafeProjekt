[project]
name = "wiwiss-booking"
version = "0.1.0"
description = "Einfaches Buchungssystem für Molitor's Cafe mit FastAPI, Streamlit und SQLite."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.137.1",
    "matplotlib>=3.11.0",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.51",
    "streamlit>=1.58.0",
    "uvicorn>=0.49.0",
]

[project.scripts]
wiwiss-booking = "wiwiss_booking:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.4.0",
]
